spring.application.name=url-shortener

# Self-contained local database: no PostgreSQL/Docker setup is required.
spring.datasource.url=jdbc:h2:file:./data/urlshortener;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 browser console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}
logging.level.com.stackfortech.urlshortening=INFO
